base:
  project_name: credit-card-fraud-mlops
  random_state: 42

data_validation:
  raw_data_path: data/raw/AIML DATASET.csv
  target_column: isFraud
  allowed_target_values:
    - 0
    - 1
  required_columns:
    - step
    - type
    - amount
    - nameOrig
    - oldbalanceOrg
    - newbalanceOrig
    - nameDest
    - oldbalanceDest
    - newbalanceDest
    - isFraud
    - isFlaggedFraud
  numerical_columns:
    - step
    - amount
    - oldbalanceOrg
    - newbalanceOrig
    - oldbalanceDest
    - newbalanceDest
    - isFraud
    - isFlaggedFraud
  categorical_columns:
    - type
    - nameOrig
    - nameDest

preprocessing:
  raw_data_path: data/raw/AIML DATASET.csv
  preprocessed_data_path: data/processed/preprocessed.parquet
  processed_data_path: data/processed/cleaned.parquet
  target_column: isFraud
  drop_columns:
    - nameOrig
    - nameDest
    - isFlaggedFraud
    - step
  categorical_columns:
    - type

feature_engineering:
  enable_balance_diffs: true
  enable_amount_ratio: true

data_split:
  test_size: 0.3
  random_state: 42
  stratify: true

smote:
  random_state: 42
  k_neighbors: 5

model:
  name: xgboost
  strategy: scale_weight_only
  use_smote: false
  use_scale_pos_weight: true
  threshold: 0.90
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1

evaluation:
  model_output_path: models/xgboost_fraud_model.joblib
  reports_dir: reports/model

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: fraud_detection_experiments
  run_name: scale_weight_only
  registered_model: CreditCardFraudDetector
  champion_alias: champion
  candidate_alias: candidate

promotion:
  min_recall_delta: 0.0
  min_pr_auc_delta: 0.0
  min_f1_delta: 0.001

experiments:
  baseline_smote_scale_weight:
    use_smote: true
    use_scale_pos_weight: true
    description: "Baseline: SMOTE + scale_pos_weight"

  smote_only:
    use_smote: true
    use_scale_pos_weight: false
    description: "SMOTE only, no scale_pos_weight"

  scale_weight_only:
    use_smote: false
    use_scale_pos_weight: true
    description: "scale_pos_weight only, no SMOTE"

threshold_analysis:
  thresholds:
    - 0.50
    - 0.60
    - 0.70
    - 0.80
    - 0.90
