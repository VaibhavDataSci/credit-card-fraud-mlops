name: CI

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 – Build, test, and Docker smoke-test
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test-and-smoke:
    name: Test and Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Python toolchain ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ── Static checks ────────────────────────────────────────────────────────
      - name: Compile application code
        run: python -m compileall -q app src

      # ── Unit / integration tests ─────────────────────────────────────────────
      - name: Run automated tests
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: pytest -q

      # ── Docker build ─────────────────────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t credit-card-fraud-api:ci .

      # ── Docker smoke test ────────────────────────────────────────────────────
      - name: Start Docker container
        shell: bash
        run: |
          if [ -d mlruns ]; then
            docker run -d --name credit-card-fraud-api-ci -p 8000:8000 \
              -v "$PWD/mlruns:/app/mlruns:ro" \
              -v "$PWD/mlruns:$PWD/mlruns" \
              credit-card-fraud-api:ci
          else
            docker run -d --name credit-card-fraud-api-ci -p 8000:8000 \
              credit-card-fraud-api:ci
          fi

      - name: Wait for API to become ready
        shell: bash
        run: |
          set -euo pipefail
          ready="false"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > health.json 2>/dev/null; then
              ready="true"
              break
            fi
            echo "Attempt $attempt/30 – waiting 2 s …"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become ready in time."
            docker logs credit-card-fraud-api-ci || true
            exit 1
          fi

      - name: Validate health response
        run: |
          python -c "
          import json, sys
          health = json.loads(open('health.json').read())
          assert health['status'] in {'healthy', 'unavailable'}, f'Unexpected status: {health[\"status\"]}'
          assert isinstance(health['model_loaded'], bool), 'model_loaded must be bool'
          print('Health check OK:', health)
          "

      - name: Validate model-info response
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --output model-info.json \
            --write-out "%{http_code}" \
            http://127.0.0.1:8000/model-info)
          echo "model-info HTTP status: $http_code"
          if [ "$http_code" = "200" ]; then
            python -c "
          import json, sys
          info = json.loads(open('model-info.json').read())
          assert info['model_name'] == 'CreditCardFraudDetector', f'Unexpected model_name: {info[\"model_name\"]}'
          assert info['alias'] == 'champion', f'Unexpected alias: {info[\"alias\"]}'
          assert isinstance(info['threshold'], float), 'threshold must be float'
          print('Model-info OK:', info)
            "
          else
            echo "No model on this runner (HTTP $http_code) – skipping model-info assertions."
          fi

      - name: Smoke test API docs endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8000/docs  > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/redoc > /dev/null
          echo "Docs endpoints OK"

      - name: Smoke test predict endpoint
        shell: bash
        run: |
          set -euo pipefail
          payload='{"type":"TRANSFER","amount":1000.0,"oldbalanceOrg":1000.0,"newbalanceOrig":0.0,"oldbalanceDest":0.0,"newbalanceDest":1000.0}'
          response_code=$(curl --silent --output prediction.json \
            --write-out "%{http_code}" \
            -X POST http://127.0.0.1:8000/predict \
            -H "content-type: application/json" \
            -d "$payload")
          echo "Predict HTTP status: $response_code"
          if [ "$response_code" = "200" ]; then
            python -c "
          import json
          pred = json.loads(open('prediction.json').read())
          assert isinstance(pred['is_fraud'], bool), 'is_fraud must be bool'
          assert 0 <= pred['fraud_probability'] <= 1, 'fraud_probability out of range'
          assert isinstance(pred['threshold'], float), 'threshold must be float'
          print('Prediction OK:', pred)
            "
          elif [ "$response_code" = "503" ]; then
            echo "No model on this runner – 503 is expected and acceptable."
          else
            echo "Unexpected HTTP status $response_code from /predict"
            cat prediction.json || true
            exit 1
          fi

      - name: Collect Docker logs (on failure)
        if: failure()
        run: docker logs credit-card-fraud-api-ci || true

      - name: Remove Docker container
        if: always()
        run: docker rm -f credit-card-fraud-api-ci || true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 – CD: publish Docker image to GHCR on every merge to main
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Docker image to GHCR
    needs: test-and-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
