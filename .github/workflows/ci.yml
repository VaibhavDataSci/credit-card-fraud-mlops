name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-smoke:
    name: Test and Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application code
        run: python -m compileall -q app src

      - name: Run automated tests
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: pytest -q

      - name: Build Docker image
        run: docker build -t credit-card-fraud-api:ci .

      - name: Start Docker container
        shell: bash
        run: |
          if [ -d mlruns ]; then
            docker run -d --name credit-card-fraud-api-ci -p 8000:8000 \
              -v "$PWD/mlruns:/app/mlruns:ro" \
              -v "$PWD/mlruns:$PWD/mlruns" \
              credit-card-fraud-api:ci
          else
            docker run -d --name credit-card-fraud-api-ci -p 8000:8000 credit-card-fraud-api:ci
          fi

      - name: Smoke test Docker API
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs credit-card-fraud-api-ci || true
            docker rm -f credit-card-fraud-api-ci || true
          }
          trap cleanup EXIT

          ready="false"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > health.json; then
              ready="true"
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("health.json").read_text())
          assert health["status"] in {"healthy", "unavailable"}
          assert isinstance(health["model_loaded"], bool)
          PY

          curl --fail --silent --show-error http://127.0.0.1:8000/model-info > model-info.json
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("model-info.json").read_text())
          assert info["model_name"] == "CreditCardFraudDetector"
          assert info["alias"] == "champion"
          assert info["threshold"] == 0.9
          PY

          curl --fail --silent --show-error http://127.0.0.1:8000/docs > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/redoc > /dev/null

          if [ -d mlruns ]; then
            response_code=$(curl --silent --output prediction.json --write-out "%{http_code}" \
              -X POST http://127.0.0.1:8000/predict \
              -H 'content-type: application/json' \
              -d '{"type":"TRANSFER","amount":1000.0,"oldbalanceOrg":1000.0,"newbalanceOrig":0.0,"oldbalanceDest":0.0,"newbalanceDest":1000.0}')
            test "$response_code" = "200"
            python - <<'PY'
            import json
            from pathlib import Path

            prediction = json.loads(Path("prediction.json").read_text())
            assert isinstance(prediction["is_fraud"], bool)
            assert 0 <= prediction["fraud_probability"] <= 1
            assert prediction["threshold"] == 0.9
            PY
          else
            echo "No local MLflow artifact is present on this clean runner; production prediction is verified locally and is not faked in CI."
            response_code=$(curl --silent --output prediction.json --write-out "%{http_code}" \
              -X POST http://127.0.0.1:8000/predict \
              -H 'content-type: application/json' \
              -d '{"type":"TRANSFER","amount":1000.0,"oldbalanceOrg":1000.0,"newbalanceOrig":0.0,"oldbalanceDest":0.0,"newbalanceDest":1000.0}')
            test "$response_code" = "503"
          fi

      - name: Remove Docker container
        if: always()
        run: docker rm -f credit-card-fraud-api-ci || true
